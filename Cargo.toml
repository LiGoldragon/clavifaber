[package]
name = "clavifaber"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "CriomOS host key-material provisioning tool."
license-file = "LICENSE.md"
repository = "https://github.com/LiGoldragon/clavifaber"
publish = false

[lib]
name = "clavifaber"
path = "src/lib.rs"

[[bin]]
name = "clavifaber"
path = "src/main.rs"

[dependencies]
der = { version = "0.7", features = ["alloc", "derive", "oid", "pem"] }
x509-cert = { version = "0.2", features = ["pem"] }
spki = { version = "0.7", features = ["alloc", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
ssh-key = { version = "0.6", features = ["ed25519"] }
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
base64ct = { version = "1", features = ["alloc"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
const-oid = "0.9"
thiserror = "2"
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", features = ["rkyv"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", features = ["rkyv"] }
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[features]
# Generated Datomizable/Composing derives sit behind this feature. The crate's
# Error, actors and tests name datom-codec unconditionally, so the dependency
# is not optional and the feature is on by default.
default = ["datom"]
datom = []

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
